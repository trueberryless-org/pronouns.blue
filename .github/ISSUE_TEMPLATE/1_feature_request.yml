name: "✨ Feature Request"
description: Suggest an idea or improvement
title: "[feature]: "
labels: ["✨ feature", "enhancement"]
assignees: [trueberryless]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to suggest an improvement! 🚀
  - type: textarea
    id: problem-description
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
      placeholder: I get frustrated when...
  - type: textarea
    id: feature-description
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
      placeholder: Add a way to...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: A clear and concise description of any alternative solutions or features you've considered.
      placeholder: Another option could be...
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: Tell us how this would help you in practice.
      placeholder: This would help because...
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: How broad is this request?
      options:
        - Small improvement
        - Medium change
        - Large feature
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any extra details, links, mockups, or screenshots.
  - type: checkboxes
    id: will-pr
    attributes:
      label: Participation
      options:
        - label: I am willing to submit a pull request for this issue.
          required: false

